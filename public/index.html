<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17132e"><title>Batalla de Dibujos</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#17132e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#45316f 0,transparent 48%),#17132e;min-height:100vh}button,input,textarea{font:inherit}button{border:0;background:#ffca57;color:#211a32;border-radius:14px;padding:13px 17px;font-weight:800;cursor:pointer}button:disabled{opacity:.43;cursor:default}.secondary{background:#3d3558;color:white}.danger{background:#ea6573;color:white}.ghost{background:#25203f;color:white;border:1px solid #62597a}.wrap{max-width:1120px;margin:auto;padding:22px}.card{background:#292441;border:1px solid #453d60;border-radius:24px;padding:24px;margin:14px 0;box-shadow:0 15px 35px #110d2440}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.muted{color:#c8bedc}.small{font-size:14px}.hero{font-weight:950;letter-spacing:-.055em;font-size:clamp(38px,7vw,76px);line-height:1;margin:10px 0}h1,h2,h3,p{margin-top:0}h2{font-size:clamp(22px,3vw,32px)}input,textarea{width:100%;background:#19152c;border:1px solid #686080;color:#fff;border-radius:13px;padding:14px;outline:none}textarea{resize:vertical;min-height:80px}.hidden{display:none!important}.pill{display:inline-flex;padding:7px 12px;border-radius:30px;background:#43385f;color:#e8dcff;font-size:13px;font-weight:700}.code{font-weight:950;font-size:clamp(50px,9vw,100px);letter-spacing:.12em;color:#ffd15e}.qr{background:#fff;padding:10px;border-radius:15px;max-width:220px;margin:auto}.qr img{display:block;width:100%}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar>*{flex:1}.list{display:grid;gap:9px}.item{padding:13px 15px;border:1px solid #5b5275;border-radius:14px;background:#201b35;display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{overflow-wrap:anywhere}.canvasbox{background:#fff;border:7px solid #fff;border-radius:18px;overflow:hidden;touch-action:none;max-width:700px;margin:0 auto;box-shadow:0 10px 30px #0005}canvas{width:100%;height:auto;display:block;touch-action:none;aspect-ratio:4/3;cursor:crosshair}.colors{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin:15px 0}.swatch{width:38px;height:38px;padding:0;border:3px solid #fff6;border-radius:50%}.swatch.active{outline:3px solid #ffcf60;border-color:#fff}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.drawing{border-radius:15px;background:#fff;padding:7px;width:100%;aspect-ratio:4/3;object-fit:contain}.drawingCard{padding:10px;border:2px solid #504769;border-radius:17px;background:#211b36;min-width:0}.drawingCard.chosen{border-color:#ffca57;background:#4b3850}.adminPreview{max-height:190px;width:100%;object-fit:contain;background:#fff;border-radius:12px}.podium{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}.podiumCard{background:#211b36;border:2px solid #645881;border-radius:18px;padding:14px;text-align:center;min-width:0}.podiumCard img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:12px}.podiumCard h3{margin:12px 0 6px}@media(max-width:560px){.podium{grid-template-columns:1fr}}.drawingCard button{width:100%;margin-top:8px}.bigslide{max-width:770px;margin:auto;text-align:center}.bigslide img{background:#fff;width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:20px}.timer{font-size:clamp(48px,9vw,90px);font-weight:950;color:#ffd05d;line-height:1}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;max-width:92vw;background:#f06981;color:#fff;border-radius:15px;padding:14px 20px;font-weight:750;z-index:20;box-shadow:0 8px 25px #0007}.notice{border-left:4px solid #ffca57;padding:12px 16px;background:#3a3055;border-radius:12px}.displayname{color:#fff;font-size:18px;font-weight:800}.score{font-size:32px;font-weight:950;color:#ffd15e}@media(max-width:760px){.wrap{padding:12px}.card{padding:16px;border-radius:18px}.grid2{grid-template-columns:1fr}.hero{font-size:44px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.item{align-items:start}.item button{white-space:nowrap}.code{font-size:64px}}
</style></head><body><div class="wrap"><header class="row between"><div><div class="pill">🎨 JUEGO EN VIVO</div><h1 class="hero">BATALLA<br>DE DIBUJOS</h1></div><span id="connection" class="pill">Conectando…</span></header><main id="app"></main></div><div id="toast" class="toast hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({reconnection:true});let state=null,identity=null,selectedPrompt=-1,selectedVotes=[],drawingSent=false,brush='#222035',brushSize=7,eraser=false,canvas,ctx,activePointer=false,latestSlide=-1,localPromptSent=false,joining=false;
const $=id=>document.getElementById(id), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='batalla-dibujos-session';const saved=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'null')}catch{return null}};
const persist=()=>localStorage.setItem(storageKey,JSON.stringify(identity));
const toast=msg=>{const n=$('toast');n.textContent=msg;n.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.add('hidden'),3500)};
const emit=(event,payload={},done=()=>{})=>socket.timeout(12000).emit(event,payload,(err,res)=>{if(err){toast('No se pudo conectar. Intenta otra vez.');return}if(!res?.ok){toast(res?.error||'No se pudo completar.');return}done(res)});
function connect(){
 if(!socket.connected)return;
 $('connection').textContent='● Conectado';
 const old=identity||saved();
 if(!old){renderHome();return;}
 identity=old;
 const event=old.admin?'admin:resume':'player:join';
 const data=old.admin?{code:old.code,adminToken:old.adminToken}:{code:old.code,name:old.name,playerToken:old.playerToken};
 socket.timeout(12000).emit(event,data,(err,res)=>{
  if(err){toast('No se pudo reconectar. Actualiza la página.');renderHome();return;}
  if(!res?.ok){
   // The server may have restarted, so the old room/token no longer exists.
   localStorage.removeItem(storageKey);identity=null;state=null;
   history.replaceState({},'',location.pathname);
   renderHome();
   toast('La sala anterior ya no está disponible. Crea una nueva o entra con otro código.');
   return;
  }
  if(!old.admin){identity={...old,playerId:res.playerId,name:res.name};persist();}
 });
}
socket.on('connect',connect);socket.on('disconnect',()=>{$('connection').textContent='○ Reconectando…'});
socket.on('state',s=>{const prev=state?.stage;const previousSelf=state?.players.find(p=>p.id===identity?.playerId)?.submitted;state=s;const isPlayer=identity&&!identity.admin;
 if(prev!==s.stage){selectedVotes=[];if(s.stage==='drawing'){drawingSent=false;}if(s.stage==='lobby'){localPromptSent=false;drawingSent=false;selectedPrompt=-1}}
 if(isPlayer&&s.players.find(p=>p.id===identity.playerId)?.submitted)drawingSent=true;
 if(isPlayer&&prev==='drawing'&&s.stage==='drawing'&&!previousSelf&&!drawingSent){const p=s.players.find(x=>x.id===identity.playerId);if(!p?.submitted)return;}
 render();});
socket.on('drawing:finish',()=>{if(identity&&!identity.admin&&state?.stage==='drawing'&&!drawingSent)submitDrawing(true)});
let tick=setInterval(()=>{const el=$('countdown');if(el&&state?.stage==='drawing'){el.textContent=Math.max(0,Math.ceil((state.drawingEndsAt-Date.now())/1000))+'s';if(!identity?.admin&&Date.now()>=state.drawingEndsAt&& !drawingSent)submitDrawing(true)}},200);
function action(type,extra={}){emit(type,extra,()=>{})}
function renderHome(){state=null;$('app').innerHTML=`<section class="grid2"><div class="card"><h2>🎤 Soy el animador</h2><p class="muted">Crea una sala y proyecta los dibujos en una pantalla grande.</p><button onclick="createRoom()">Crear sala</button></div><div class="card"><h2>✏️ Quiero jugar</h2><p class="muted">Escribe el código y tu nombre.</p><form onsubmit="joinRoom(event)"><input id="roomInput" maxlength="3" inputmode="numeric" pattern="[0-9]{3}" placeholder="Código de 3 dígitos" value="${new URLSearchParams(location.search).get('sala')||''}" required><input id="nameInput" maxlength="24" placeholder="Tu nombre" minlength="2" required style="margin:10px 0"><button type="submit" id="joinBtn">Entrar a la sala</button></form></div></section>`}
function createRoom(){emit('admin:create',{},res=>{identity={admin:true,code:res.code,adminToken:res.adminToken};persist();history.replaceState({},'',`?admin=${identity.code}`)})}
function joinRoom(e){e.preventDefault();if(joining)return;joining=true;const code=$('roomInput').value.trim(),name=$('nameInput').value.trim();const b=$('joinBtn');b.disabled=true;b.textContent='Entrando…';socket.timeout(12000).emit('player:join',{code,name},(err,res)=>{joining=false;if(b){b.disabled=false;b.textContent='Entrar a la sala'}if(err||!res?.ok){toast(res?.error||'No se pudo conectar. Intenta otra vez.');return}identity={admin:false,code,name:res.name,playerId:res.playerId,playerToken:res.playerToken};persist();history.replaceState({},'',`?sala=${code}`)})}
function logout(){localStorage.removeItem(storageKey);identity=null;state=null;location.href='/'}
function render(){if(!identity||!state){if(!identity)renderHome();return}if(identity.code!==state.code)return;const isAdmin=identity.admin;
 const top=`<div class="row between"><span class="pill">SALA ${state.code} · ${state.players.length}/50 jugadores</span><button class="ghost" onclick="logout()">Salir</button></div>`;
 const oldCanvas=!isAdmin&&state.stage==='drawing'&&!drawingSent?$('drawCanvas'):null;const savedImage=oldCanvas?oldCanvas.getContext('2d').getImageData(0,0,640,480):null;
 $('app').innerHTML=top+(isAdmin?adminUI():playerUI());if(!isAdmin&&state.stage==='drawing'&&!drawingSent){setupCanvas();if(savedImage&&ctx)ctx.putImageData(savedImage,0,0)}if(isAdmin&&state.stage==='lobby')setupQr();}
function setupQr(){const img=$('qrImage');if(img)img.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(location.origin+'/?sala='+state.code)}
const tags=()=>`<span class="pill">${state.players.filter(x=>x.online).length} conectados</span><span class="pill">${state.players.filter(x=>x.submitted).length} entregados</span>`;
function adminUI(){let h='';if(state.stage==='lobby'){
 h=`<div class="grid2"><div class="card"><h2>Que todos entren escaneando el QR o usando el código.</h2><div class="code">${state.code}</div><div class="qr"><img id="qrImage" alt="Código QR"></div><p class="muted small">${escapeHTML(location.origin+'/?sala='+state.code)}</p><button class="secondary" onclick="navigator.clipboard.writeText(location.origin+'/?sala='+state.code).then(()=>toast('Enlace copiado'))">Copiar enlace</button></div><div class="card"><h2>Propuestas de desafíos (${state.proposed})</h2><p class="muted">Los jugadores pueden enviar una idea. Elige la que todos dibujarán.</p><div class="list">${state.prompts.length?state.prompts.map(x=>`<div class="item"><div><strong>${escapeHTML(x.text)}</strong><div class="muted small">Propuesto por ${escapeHTML(x.name)}</div></div><button class="${state.prompt===x.text?'':'secondary'}" onclick="action('admin:choose',{index:${x.index}})">${state.prompt===x.text?'✓ Elegido':'Elegir'}</button></div>`).join(''):'<p class="muted">Aún no hay propuestas.</p>'}</div>${state.prompt?`<div class="notice" style="margin-top:15px">Elegido: <strong>${escapeHTML(state.prompt)}</strong></div>`:''}<div class="row" style="margin-top:16px"><button ${state.prompt?'':'disabled'} onclick="action('admin:start')">Comenzar: 60 segundos</button></div></div></div>`;
 }else if(state.stage==='drawing'){
 h=`<div class="card"><div class="row between"><div><h2>¡Todos a dibujar!</h2><p class="muted">${escapeHTML(state.prompt)}</p>${tags()}</div><div id="countdown" class="timer">60s</div></div><p class="small muted">Al cumplirse un minuto o si todos entregan, aparece la presentación.</p><button class="secondary" onclick="action('admin:present')">Terminar dibujos y presentar</button><h3 style="margin-top:22px">Dibujos recibidos (${state.gallery.length})</h3><p class="muted small">Puedes revisar cada dibujo y borrar los que no correspondan antes de abrir la votación.</p>${adminGallery()}</div>`;
 }else if(state.stage==='presentation'||state.stage==='voting'){
 h=`<div class="card"><div class="row between"><h2>${state.stage==='presentation'?'Presentación de dibujos':'Votación abierta'}</h2><span class="pill">${state.gallery.length} dibujos · ${state.slide+1}/${state.gallery.length}</span></div>${slideUI()}${state.stage==='presentation'?`<h3 style="margin-top:22px">Revisar y borrar dibujos</h3>${adminGallery()}`:''}<div class="row" style="justify-content:center;margin-top:16px"><button class="secondary" onclick="action('admin:slide',{delta:-1})">← Anterior</button><button class="secondary" onclick="action('admin:slide',{delta:1})">Siguiente →</button></div>${state.stage==='presentation'?'<p class="muted" style="margin-top:20px">Presenta los dibujos uno por uno. Cuando quieras, abre la votación.</p><button onclick="action(\'admin:voting\')">Abrir votación</button>':`<p class="muted">${state.votesCast}/${state.players.length} votos completos (2 favoritos por jugador)</p><button onclick="action('admin:results')">Cerrar votación y mostrar resultados</button>`}</div>`;
 }else if(state.stage==='results'){
 h=`<div class="card"><h2>🏆 Resultados de la batalla</h2>${resultsUI()}<button onclick="if(confirm('¿Comenzar otra ronda con los mismos jugadores?'))action('admin:reset')">Nueva ronda</button></div>`;
 }
 return h+`<div class="card"><h2>Jugadores (${state.players.length}/50)</h2><div class="list">${state.players.length?state.players.map(p=>`<div class="item"><span><strong>${escapeHTML(p.name)}</strong> <span class="muted small">${p.online?'🟢':'⚪'} · ${p.removed?'Dibujo borrado':p.submitted?'Dibujo enviado':'Sin enviar'} ${p.voted?'· Votó':''}</span></span></div>`).join(''):'<span class="muted">Todavía no se conectan jugadores.</span>'}</div></div>`;
}
function adminGallery(){return state.gallery.length?`<div class="gallery">${state.gallery.map(d=>`<div class="drawingCard"><img class="adminPreview" src="${d.image}" alt="Dibujo de ${escapeHTML(d.name)}"><strong>${escapeHTML(d.name)}</strong><button class="danger" onclick="deleteDrawing('${d.id}')">Borrar</button></div>`).join('')}</div>`:'<p class="muted">Todavía no llegan dibujos.</p>'}
function deleteDrawing(id){if(confirm('¿Borrar este dibujo de la partida? El jugador no podrá reenviarlo en esta ronda.'))emit('admin:delete-drawing',{id},()=>toast('Dibujo borrado'))}
function slideUI(){if(!state.gallery.length)return '<p class="muted">No se enviaron dibujos.</p>';const d=state.gallery[state.slide]||state.gallery[0];return `<div class="bigslide"><img src="${d.image}" alt="Dibujo de ${escapeHTML(d.name)}"><h2 style="margin:12px 0">${escapeHTML(d.name)}</h2></div>`}
function resultsUI(){const firstTwo=state.results.slice(0,2);const podio=firstTwo.length?`<div class="podium">${firstTwo.map((d,i)=>`<div class="podiumCard"><h3>${i===0?'🥇 Primer lugar':'🥈 Segundo lugar'}</h3><img src="${d.image}" alt="Dibujo de ${escapeHTML(d.name)}"><div class="displayname">${escapeHTML(d.name)}</div><div class="score">${d.votes} ${d.votes===1?'voto':'votos'}</div></div>`).join('')}</div>`:'';return podio+`<div class="list" style="margin-bottom:20px">${state.results.map((x,i)=>`<div class="item"><strong>${['🥇','🥈','🥉'][i]||'🎨'} ${escapeHTML(x.name)}</strong><span class="score">${x.votes} ${x.votes===1?'voto':'votos'}</span></div>`).join('')||'No hay dibujos.'}</div>`}
function playerUI(){const me=state.players.find(p=>p.id===identity.playerId);if(!me)return '<div class="card">Recuperando sesión…</div>';let h='';
 if(state.stage==='lobby')h=`<div class="card"><h2>¡Hola, ${escapeHTML(identity.name)}! 👋</h2><p class="muted">Esperando a que el animador elija el desafío.</p><div class="notice">Propón una frase divertida para que todos la dibujen. Ejemplo: «Un pingüino llegando tarde al colegio».</div><form onsubmit="sendPrompt(event)" style="margin-top:16px"><textarea id="promptInput" placeholder="Tu idea de dibujo…" maxlength="110" minlength="5" ${localPromptSent?'disabled':''} required></textarea><button style="margin-top:10px" ${localPromptSent?'disabled':''}>${localPromptSent?'✓ Propuesta enviada':'Enviar propuesta'}</button></form><p class="muted small">${state.players.length}/50 personas en la sala</p></div>`;
 else if(state.stage==='drawing')h=`<div class="card"><div class="row between"><h2>🎨 ¡A dibujar!</h2><div id="countdown" class="timer">60s</div></div><h2 style="color:#ffce64">${escapeHTML(state.prompt)}</h2>${me.removed?'<div class="notice">Tu dibujo fue retirado de esta ronda por el animador.</div>':drawingSent||me.submitted?'<div class="notice">✅ ¡Dibujo enviado! Espera a los demás.</div>':`<div class="canvasbox"><canvas id="drawCanvas" width="640" height="480"></canvas></div><div class="colors">${['#222035','#e34b63','#ff9b36','#f6c34e','#36a678','#3794e8','#8c57ca'].map(c=>`<button class="swatch ${brush===c&&!eraser?'active':''}" style="background:${c}" onclick="setBrush('${c}')" aria-label="Color"></button>`).join('')}<button class="secondary" onclick="eraser=true;brushSize=25;updateTools()">Goma</button><button class="secondary" onclick="eraseAll()">Borrar todo</button></div><div class="row" style="margin-bottom:14px"><span class="muted small">Grosor</span><input type="range" style="flex:1" min="3" max="24" value="${brushSize}" oninput="brushSize=+this.value"></div><button style="width:100%" onclick="submitDrawing(false)">Enviar dibujo</button>`}</div>`;
 else if(state.stage==='presentation')h=`<div class="card"><h2>🖼️ Presentación en curso</h2><p class="muted">Mira la pantalla principal. El animador está mostrando los dibujos uno por uno.</p><div class="notice">Cuando se abra la votación, aparecerán todos los dibujos aquí y podrás elegir tus dos favoritos.</div></div>`;
 else if(state.stage==='voting')h=`<div class="card"><h2>❤️ Elige tus 2 dibujos favoritos</h2><p class="muted">Marca exactamente dos. No puedes votar por tu propio dibujo.</p>${galleryUI(true)}<p class="muted small" style="margin-top:14px">${selectedVotes.length}/2 seleccionados</p><button id="voteBtn" ${selectedVotes.length===2&&!me.voted?'':'disabled'} onclick="sendVote()">${me.voted?'✓ Voto enviado':'Confirmar mis 2 votos'}</button></div>`;
 else if(state.stage==='results')h=`<div class="card"><h2>🏆 ¡Resultados!</h2>${resultsUI()}<p class="muted">El animador puede iniciar otra ronda.</p></div>`;
 return h;
}
function galleryUI(voting){const me=identity.playerId;const sent=state.players.find(x=>x.id===me)?.voted;return `<div class="gallery">${state.gallery.map(d=>`<div class="drawingCard ${selectedVotes.includes(d.id)?'chosen':''}"><img class="drawing" loading="lazy" src="${d.image}" alt="Dibujo de ${escapeHTML(d.name)}"><div class="displayname">${escapeHTML(d.name)} ${d.id===me?'(tú)':''}</div>${voting?`<button ${d.id===me||sent?'disabled':''} class="${selectedVotes.includes(d.id)?'':'secondary'}" onclick="toggleVote('${d.id}')">${selectedVotes.includes(d.id)?'✓ Elegido':'Votar'}</button>`:''}</div>`).join('')}</div>`}
function toggleVote(id){const idx=selectedVotes.indexOf(id);if(idx>=0)selectedVotes.splice(idx,1);else if(selectedVotes.length<2)selectedVotes.push(id);else return toast('Solo puedes seleccionar dos.');render()}
function sendVote(){if(selectedVotes.length!==2)return;emit('vote:cast',{ids:selectedVotes},()=>toast('¡Tus dos votos se registraron!'))}
function sendPrompt(e){e.preventDefault();const text=$('promptInput').value.trim();emit('prompt:send',{text},()=>{localPromptSent=true;toast('Propuesta enviada');render()})}
function setBrush(c){brush=c;eraser=false;brushSize=7;updateTools()}
function updateTools(){document.querySelectorAll('.swatch').forEach(el=>el.classList.toggle('active',!eraser&&el.style.backgroundColor===hexToRGB(brush)))}
function hexToRGB(hex){return `rgb(${parseInt(hex.slice(1,3),16)}, ${parseInt(hex.slice(3,5),16)}, ${parseInt(hex.slice(5,7),16)})`}
function setupCanvas(){canvas=$('drawCanvas');if(!canvas)return;ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,640,480);ctx.lineCap='round';ctx.lineJoin='round';let last=null;
 function coords(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*480/r.height}}
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();activePointer=true;canvas.setPointerCapture(e.pointerId);last=coords(e);paint(last,last)});
 canvas.addEventListener('pointermove',e=>{if(!activePointer)return;e.preventDefault();const next=coords(e);paint(last,next);last=next});
 canvas.addEventListener('pointerup',()=>{activePointer=false;last=null});canvas.addEventListener('pointercancel',()=>{activePointer=false;last=null});
 function paint(a,b){if(!ctx)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=eraser?'#ffffff':brush;ctx.lineWidth=brushSize;ctx.stroke();}
}
function eraseAll(){if(!ctx)return;if(confirm('¿Borrar todo tu dibujo?')){ctx.fillStyle='#fff';ctx.fillRect(0,0,640,480)}}
function submitDrawing(auto){if(drawingSent||!canvas||!identity||state?.stage!=='drawing')return;const image=canvas.toDataURL('image/png');if(image.length>750000){toast('El dibujo es demasiado grande. Prueba borrar algunos trazos.');return}drawingSent=true;emit('drawing:submit',{image},()=>{if(!auto)toast('¡Dibujo enviado!')});render()}
identity=saved();renderHome();if(socket.connected)connect();
</script></body></html>
